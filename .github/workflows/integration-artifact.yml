name: integration-artifact

on:
  push:
    branches:
      - integration/latest
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to build"
        required: false
        default: integration/latest

permissions:
  contents: read

concurrency:
  group: integration-artifact-${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-macos-binaries:
    name: Build macOS binaries - ${{ matrix.bundle }}
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        working-directory: codex-rs
    env:
      TARGET: aarch64-apple-darwin
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: packed
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - bundle: primary
            binaries: "codex codex-code-mode-host codex-responses-api-proxy"
          - bundle: app-server
            binaries: "codex-app-server codex-code-mode-host"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ env.TARGET }}

      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ env.TARGET }}

      - name: Cargo build
        shell: bash
        env:
          BINARIES: ${{ matrix.binaries }}
        run: |
          set -euo pipefail
          STABLE_GIT_COMMIT="$(git rev-parse HEAD)"
          export STABLE_GIT_COMMIT

          build_args=()
          for binary in $BINARIES; do
            build_args+=(--bin "$binary")
          done

          cargo build \
            --locked \
            --release \
            --timings \
            --target "$TARGET" \
            "${build_args[@]}"

      - name: Upload Cargo timings
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cargo-timings-integration-artifact-${{ env.TARGET }}-${{ matrix.bundle }}
          path: ${{ env.CARGO_TARGET_DIR }}/**/cargo-timings/cargo-timing.html
          if-no-files-found: warn

      - name: Stage macOS binaries
        shell: bash
        env:
          BINARIES: ${{ matrix.binaries }}
        run: |
          set -euo pipefail
          release_dir="${CARGO_TARGET_DIR}/${TARGET}/release"
          output_dir="macos-binaries-dist/${TARGET}/${{ matrix.bundle }}"
          mkdir -p "$output_dir"

          for binary in $BINARIES; do
            binary_path="${release_dir}/${binary}"
            dsym_path="${binary_path}.dSYM"
            if [[ ! -f "$binary_path" ]]; then
              echo "Binary $binary_path not found" >&2
              exit 1
            fi
            if [[ ! -d "$dsym_path" ]]; then
              echo "dSYM $dsym_path not found" >&2
              exit 1
            fi

            cp "$binary_path" "$output_dir/${binary}"
            cp -RL "$dsym_path" "$output_dir/${binary}.dSYM"
          done

      - name: Upload macOS binaries
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: macos-binaries-${{ env.TARGET }}-${{ matrix.bundle }}
          path: codex-rs/macos-binaries-dist/${{ env.TARGET }}/${{ matrix.bundle }}/**
          if-no-files-found: error

  package-macos:
    name: Package macOS integration artifact
    needs: build-macos-binaries
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        working-directory: codex-rs
    env:
      CODEX_REPO_ROOT: ${{ github.workspace }}
      TARGET: aarch64-apple-darwin
      ARTIFACT_NAME: codex-integration-aarch64-apple-darwin
      MACOS_BINARIES: "codex codex-code-mode-host codex-responses-api-proxy codex-app-server"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - name: Download prebuilt macOS primary binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-binaries-${{ env.TARGET }}-primary
          path: ${{ runner.temp }}/macos-binaries/primary

      - name: Download prebuilt macOS app-server binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-binaries-${{ env.TARGET }}-app-server
          path: ${{ runner.temp }}/macos-binaries/app-server

      - name: Stage downloaded macOS binaries
        shell: bash
        run: |
          set -euo pipefail
          release_dir="${CARGO_TARGET_DIR}/${TARGET}/release"
          mkdir -p "$release_dir"
          for bundle in primary app-server; do
            cp -R "${RUNNER_TEMP}/macos-binaries/${bundle}/." "$release_dir/"
          done

      - name: Verify binaries
        shell: bash
        run: |
          set -euo pipefail
          release_dir="${CARGO_TARGET_DIR}/${TARGET}/release"
          for binary in $MACOS_BINARIES; do
            ls -lh "$release_dir/${binary}"
            ls -ld "$release_dir/${binary}.dSYM"
          done

      - name: Build symbols archive and strip binaries
        shell: bash
        run: |
          set -euo pipefail
          bash "${GITHUB_WORKSPACE}/.github/scripts/archive-release-symbols-and-strip-binaries.sh" \
            --target "$TARGET" \
            --artifact-name "$TARGET" \
            --release-dir "${CARGO_TARGET_DIR}/${TARGET}/release" \
            --archive-dir "symbols-dist/${TARGET}" \
            --binaries "$MACOS_BINARIES"

      - name: Stage release artifacts
        shell: bash
        run: |
          set -euo pipefail
          dest="dist/${TARGET}"
          release_dir="${CARGO_TARGET_DIR}/${TARGET}/release"
          mkdir -p "$dest"

          for binary in $MACOS_BINARIES; do
            cp "${release_dir}/${binary}" "$dest/${binary}-${TARGET}"
          done

      - name: Build Codex package archives
        shell: bash
        run: |
          set -euo pipefail
          archive_dir="dist/${TARGET}"
          mkdir -p "$archive_dir"
          for bundle in primary app-server; do
            bash "${GITHUB_WORKSPACE}/.github/scripts/build-codex-package-archive.sh" \
              --target "$TARGET" \
              --bundle "$bundle" \
              --entrypoint-dir "${CARGO_TARGET_DIR}/${TARGET}/release" \
              --archive-dir "$archive_dir"
          done

      - name: Resolve artifact metadata
        id: artifact_metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          version="$("${CARGO_TARGET_DIR}/${TARGET}/release/codex" --version)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build Python runtime wheel
        shell: bash
        run: |
          set -euo pipefail

          case "$TARGET" in
            aarch64-apple-darwin)
              platform_tag="macosx_11_0_arm64"
              ;;
            *)
              echo "No Python runtime wheel platform tag for $TARGET"
              exit 1
              ;;
          esac

          venv_dir="${RUNNER_TEMP}/python-runtime-build-venv"
          if command -v python3 >/dev/null 2>&1; then
            python_bin="python3"
          else
            python_bin="python"
          fi

          "$python_bin" -m venv "$venv_dir"
          venv_python="${venv_dir}/bin/python"
          "$venv_python" -m pip install build

          stage_dir="${RUNNER_TEMP}/openai-codex-cli-bin-${TARGET}"
          wheel_dir="${GITHUB_WORKSPACE}/python-runtime-dist/${TARGET}"
          "$python_bin" "${GITHUB_WORKSPACE}/sdk/python/scripts/update_sdk_artifacts.py" \
            stage-runtime \
            "$stage_dir" \
            "${GITHUB_WORKSPACE}/codex-rs/dist/${TARGET}/codex-package-${TARGET}.tar.gz" \
            --codex-version "${CODEX_VERSION#codex-cli }" \
            --platform-tag "$platform_tag"
          "$venv_python" -m build --wheel --outdir "$wheel_dir" "$stage_dir"
        env:
          CODEX_VERSION: ${{ steps.artifact_metadata.outputs.version }}

      - name: Compress release artifacts
        shell: bash
        run: |
          set -euo pipefail
          dest="dist/${TARGET}"
          for f in "$dest"/*; do
            base="$(basename "$f")"
            if [[ "$base" == *.tar.gz || "$base" == *.tar.zst || "$base" == *.zip || "$base" == *.dmg ]]; then
              continue
            fi

            tar -C "$dest" -czf "$dest/${base}.tar.gz" "$base"
            zstd -T0 -19 --rm "$dest/$base"
          done

      - name: Write artifact metadata
        shell: bash
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then
            python_bin="python3"
          else
            python_bin="python"
          fi
          "$python_bin" - <<'PY'
          import json
          import os
          from pathlib import Path

          dist_dir = Path("dist") / os.environ["TARGET"]
          metadata = {
              "artifact_name": os.environ["ARTIFACT_NAME"],
              "archive": f"codex-package-{os.environ['TARGET']}.tar.gz",
              "commit": os.environ["BUILD_COMMIT"],
              "codex_version": os.environ["CODEX_VERSION"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "source_ref": os.environ["BUILD_REF"],
              "target": os.environ["TARGET"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
          }
          (dist_dir / f"integration-artifact-{os.environ['TARGET']}.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n"
          )
          PY
        env:
          BUILD_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
          BUILD_COMMIT: ${{ steps.artifact_metadata.outputs.commit }}
          CODEX_VERSION: ${{ steps.artifact_metadata.outputs.version }}

      - name: Upload integration artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            codex-rs/dist/${{ env.TARGET }}/*
            codex-rs/symbols-dist/${{ env.TARGET }}/*
            python-runtime-dist/${{ env.TARGET }}/*.whl
          if-no-files-found: error

  build-windows-binaries:
    name: Build Windows binaries - ${{ matrix.bundle }}
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        working-directory: codex-rs
    env:
      TARGET: x86_64-pc-windows-msvc
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: off
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - bundle: primary
            binaries: "codex codex-code-mode-host codex-responses-api-proxy"
          - bundle: helpers
            binaries: "codex-windows-sandbox-setup codex-command-runner"
          - bundle: app-server
            binaries: "codex-app-server codex-code-mode-host"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          persist-credentials: false

      - name: Configure CI build paths
        shell: bash
        run: |
          set -euo pipefail
          ci_build_root="${RUNNER_TEMP//\\//}/codex-ci"
          build_dirs=(
            "$ci_build_root/cargo-target"
            "$ci_build_root/tmp"
          )
          mkdir -p "${build_dirs[@]}"
          {
            echo "CI_BUILD_ROOT=$ci_build_root"
            echo "CARGO_TARGET_DIR=$ci_build_root/cargo-target"
            echo "TEMP=$ci_build_root/tmp"
            echo "TMP=$ci_build_root/tmp"
            echo "CARGO_NET_GIT_FETCH_WITH_CLI=true"
          } >> "$GITHUB_ENV"

      - name: Install DotSlash
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2

      - name: Make DotSlash available in PATH
        shell: pwsh
        run: Copy-Item (Get-Command dotslash).Source -Destination "$env:LOCALAPPDATA\Microsoft\WindowsApps\dotslash.exe"

      - name: Enable Git long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ env.TARGET }}

      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ env.TARGET }}

      - name: Configure LLVM linker
        uses: ./.github/actions/setup-msvc-env
        with:
          target: ${{ env.TARGET }}

      - name: Cargo build
        shell: bash
        env:
          BINARIES: ${{ matrix.binaries }}
        run: |
          set -euo pipefail
          export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC
          export STABLE_GIT_COMMIT
          STABLE_GIT_COMMIT="$(git rev-parse HEAD)"

          build_args=()
          for binary in $BINARIES; do
            build_args+=(--bin "$binary")
          done

          cargo build \
            --locked \
            --release \
            --timings \
            --target "$TARGET" \
            "${build_args[@]}"

      - name: Upload Cargo timings
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cargo-timings-integration-artifact-${{ env.TARGET }}-${{ matrix.bundle }}
          path: ${{ runner.temp }}/codex-ci/cargo-target/**/cargo-timings/cargo-timing.html
          if-no-files-found: warn

      - name: Stage Windows binaries
        shell: bash
        env:
          BINARIES: ${{ matrix.binaries }}
        run: |
          set -euo pipefail
          release_dir="${CARGO_TARGET_DIR}/${TARGET}/release"
          output_dir="$release_dir/staged-${{ matrix.bundle }}"
          mkdir -p "$output_dir"
          for binary in $BINARIES; do
            pdb_name="${binary//-/_}"
            pdb_path="$release_dir/${pdb_name}.pdb"
            if [[ ! -f "$pdb_path" ]]; then
              pdb_path="$release_dir/${binary}.pdb"
            fi
            if [[ ! -f "$pdb_path" ]]; then
              echo "PDB for $binary not found at $release_dir/${pdb_name}.pdb or $release_dir/${binary}.pdb" >&2
              exit 1
            fi

            cp "$release_dir/${binary}.exe" "$output_dir/${binary}.exe"
            cp "$pdb_path" "$output_dir/${binary}.pdb"
          done

      - name: Upload Windows binaries
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-binaries-${{ env.TARGET }}-${{ matrix.bundle }}
          path: ${{ runner.temp }}/codex-ci/cargo-target/${{ env.TARGET }}/release/staged-${{ matrix.bundle }}/*
          if-no-files-found: error

  package-windows:
    name: Package Windows integration artifact
    needs: build-windows-binaries
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        working-directory: codex-rs
    env:
      CODEX_REPO_ROOT: ${{ github.workspace }}
      TARGET: x86_64-pc-windows-msvc
      ARTIFACT_NAME: codex-integration-x86_64-pc-windows-msvc
      WINDOWS_BINARIES: "codex codex-code-mode-host codex-responses-api-proxy codex-windows-sandbox-setup codex-command-runner codex-app-server"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          persist-credentials: false

      - name: Configure CI build paths
        shell: bash
        run: |
          set -euo pipefail
          ci_build_root="${RUNNER_TEMP//\\//}/codex-ci"
          release_dir="$ci_build_root/cargo-target/$TARGET/release"
          tmp_dir="$ci_build_root/tmp"
          mkdir -p "$release_dir" "$tmp_dir"
          {
            echo "CI_BUILD_ROOT=$ci_build_root"
            echo "CARGO_TARGET_DIR=$ci_build_root/cargo-target"
            echo "TEMP=$tmp_dir"
            echo "TMP=$tmp_dir"
            echo "CARGO_NET_GIT_FETCH_WITH_CLI=true"
          } >> "$GITHUB_ENV"

      - name: Install DotSlash
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2

      - name: Make DotSlash available in PATH
        shell: pwsh
        run: Copy-Item (Get-Command dotslash).Source -Destination "$env:LOCALAPPDATA\Microsoft\WindowsApps\dotslash.exe"

      - name: Download prebuilt Windows primary binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-binaries-${{ env.TARGET }}-primary
          path: ${{ runner.temp }}/codex-ci/cargo-target/${{ env.TARGET }}/release

      - name: Download prebuilt Windows helper binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-binaries-${{ env.TARGET }}-helpers
          path: ${{ runner.temp }}/codex-ci/cargo-target/${{ env.TARGET }}/release

      - name: Download prebuilt Windows app-server binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-binaries-${{ env.TARGET }}-app-server
          path: ${{ runner.temp }}/codex-ci/cargo-target/${{ env.TARGET }}/release

      - name: Verify binaries
        shell: bash
        run: |
          set -euo pipefail
          for binary in $WINDOWS_BINARIES; do
            ls -lh "$CARGO_TARGET_DIR/$TARGET/release/${binary}.exe"
            ls -lh "$CARGO_TARGET_DIR/$TARGET/release/${binary}.pdb"
          done

      - name: Build symbols archive
        shell: bash
        run: |
          set -euo pipefail
          bash "${GITHUB_WORKSPACE}/.github/scripts/archive-release-symbols-and-strip-binaries.sh" \
            --target "$TARGET" \
            --artifact-name "$TARGET" \
            --release-dir "${CARGO_TARGET_DIR}/${TARGET}/release" \
            --archive-dir "symbols-dist/${TARGET}" \
            --binaries "$WINDOWS_BINARIES"

      - name: Stage release artifacts
        shell: bash
        run: |
          set -euo pipefail
          dest="dist/${TARGET}"
          release_dir="${CARGO_TARGET_DIR}/${TARGET}/release"
          mkdir -p "$dest"

          for binary in $WINDOWS_BINARIES; do
            cp "${release_dir}/${binary}.exe" \
              "$dest/${binary}-${TARGET}.exe"
          done

      - name: Build Codex package archives
        shell: bash
        run: |
          set -euo pipefail
          archive_dir="dist/${TARGET}"
          archive_script="${GITHUB_WORKSPACE}/.github/scripts/build-codex-package-archive.sh"
          temp_root="${RUNNER_TEMP//\\//}/codex-package-archives"
          mkdir -p "$temp_root/primary" "$temp_root/app-server"

          for bundle in primary app-server; do
            TMPDIR="$temp_root/$bundle" \
            TMP="$temp_root/$bundle" \
            TEMP="$temp_root/$bundle" \
              bash "$archive_script" \
                --target "$TARGET" \
                --bundle "$bundle" \
                --entrypoint-dir "${CARGO_TARGET_DIR}/${TARGET}/release" \
                --archive-dir "$archive_dir"
          done

      - name: Resolve artifact metadata
        id: artifact_metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          version="$("${CARGO_TARGET_DIR}/${TARGET}/release/codex.exe" --version)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build Python runtime wheel
        shell: bash
        run: |
          set -euo pipefail

          python -m venv "${RUNNER_TEMP}/python-runtime-build-venv"
          "${RUNNER_TEMP}/python-runtime-build-venv/Scripts/python.exe" -m pip install build

          stage_dir="${RUNNER_TEMP}/openai-codex-cli-bin-${TARGET}"
          wheel_dir="${GITHUB_WORKSPACE}/python-runtime-dist/${TARGET}"
          python "${GITHUB_WORKSPACE}/sdk/python/scripts/update_sdk_artifacts.py" \
            stage-runtime \
            "$stage_dir" \
            "dist/${TARGET}/codex-package-${TARGET}.tar.gz" \
            --codex-version "${CODEX_VERSION#codex-cli }" \
            --platform-tag win_amd64
          "${RUNNER_TEMP}/python-runtime-build-venv/Scripts/python.exe" -m build --wheel --outdir "$wheel_dir" "$stage_dir"
        env:
          CODEX_VERSION: ${{ steps.artifact_metadata.outputs.version }}

      - name: Compress release artifacts
        shell: bash
        run: |
          set -euo pipefail
          dest="dist/${TARGET}"
          target="$TARGET"
          repo_root="$PWD"
          export dest target repo_root

          printf '%s\0' "$dest"/* |
            xargs -0 -n1 -P2 bash -c '
            set -euo pipefail
            f=$1
            base="$(basename "$f")"
            if [[ "$base" == *.tar.gz || "$base" == *.tar.zst || "$base" == *.zip || "$base" == *.dmg ]]; then
              exit 0
            fi

            tar -C "$dest" -czf "$dest/${base}.tar.gz" "$base"

            if [[ "$base" == "codex-${target}.exe" ]]; then
              bundle_dir="$(mktemp -d)"
              runner_src="$dest/codex-command-runner-${target}.exe"
              setup_src="$dest/codex-windows-sandbox-setup-${target}.exe"
              if [[ -f "$runner_src" && -f "$setup_src" ]]; then
                cp "$dest/$base" "$bundle_dir/$base"
                cp "$runner_src" "$bundle_dir/codex-command-runner.exe"
                cp "$setup_src" "$bundle_dir/codex-windows-sandbox-setup.exe"
                (cd "$bundle_dir" && 7z a "$repo_root/$dest/${base}.zip" .)
              else
                echo "warning: missing sandbox binaries; falling back to single-binary zip"
                echo "warning: expected $runner_src and $setup_src"
                (cd "$dest" && 7z a "${base}.zip" "$base")
              fi
              rm -rf "$bundle_dir"
            else
              (cd "$dest" && 7z a "${base}.zip" "$base")
            fi

            "${GITHUB_WORKSPACE}/.github/workflows/zstd" -T0 -19 "$dest/$base"
          ' _

      - name: Write artifact metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          dist_dir = Path("dist") / os.environ["TARGET"]
          metadata = {
              "artifact_name": os.environ["ARTIFACT_NAME"],
              "archive": f"codex-package-{os.environ['TARGET']}.tar.gz",
              "commit": os.environ["BUILD_COMMIT"],
              "codex_version": os.environ["CODEX_VERSION"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "source_ref": os.environ["BUILD_REF"],
              "target": os.environ["TARGET"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
          }
          (dist_dir / f"integration-artifact-{os.environ['TARGET']}.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n"
          )
          PY
        env:
          BUILD_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
          BUILD_COMMIT: ${{ steps.artifact_metadata.outputs.commit }}
          CODEX_VERSION: ${{ steps.artifact_metadata.outputs.version }}

      - name: Upload integration artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            codex-rs/dist/${{ env.TARGET }}/*
            codex-rs/symbols-dist/${{ env.TARGET }}/*
            python-runtime-dist/${{ env.TARGET }}/*.whl
          if-no-files-found: error

  release:
    name: Publish integration prerelease
    needs:
      - package-macos
      - package-windows
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download integration artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-dist
          pattern: codex-integration-*
          merge-multiple: true

      - name: Add Codex package checksum manifest
        run: |
          set -euo pipefail

          manifest="release-dist/codex-package_SHA256SUMS"
          tmp_manifest="$(mktemp)"
          find release-dist -type f \
            \( -name 'codex-package-*.tar.gz' -o -name 'codex-app-server-package-*.tar.gz' \) \
            -print |
            sort |
            while IFS= read -r archive; do
              sha256sum "$archive" |
                awk -v name="$(basename "$archive")" '{ print $1 "  " name }'
            done > "$tmp_manifest"

          if [[ ! -s "$tmp_manifest" ]]; then
            echo "No Codex package archives found for checksum manifest"
            exit 1
          fi

          mv "$tmp_manifest" "$manifest"
          cat "$manifest"

      - name: Add config schema and installer scripts
        run: |
          set -euo pipefail
          cp codex-rs/core/config.schema.json release-dist/config-schema.json
          cp scripts/install/install.sh release-dist/install.sh
          cp scripts/install/install.ps1 release-dist/install.ps1

      - name: Define integration release metadata
        id: release_metadata
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short=12 HEAD)"
          notes_path="${RUNNER_TEMP}/integration-release-notes.md"
          {
            echo "Integration build for ${GITHUB_REF_NAME}"
            echo
            echo "Commit: ${GITHUB_SHA}"
            echo "Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "This is an unsigned integration prerelease. It mirrors upstream release asset packaging where this fork has CI infrastructure."
          } > "$notes_path"
          echo "name=integration-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "tag=integration-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "notes_path=${notes_path}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          name: ${{ steps.release_metadata.outputs.name }}
          tag_name: ${{ steps.release_metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ steps.release_metadata.outputs.notes_path }}
          files: release-dist/**
          overwrite_files: true
          make_latest: false
          prerelease: true
